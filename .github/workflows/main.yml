name: Build APK
on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'assets/**'
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Secrets cannot be used in step `if:` directly; this flag is "true" only when all three exist.
      HAS_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source zip (flat or normal; newest *.zip in repo root)
        run: |
          Z="$(ls -t ./*.zip | head -1)"
          echo "Using $Z"
          mkdir -p proj
          if unzip -Z1 "$Z" | grep -q '/'; then
            unzip -q "$Z" -d proj
            # Normal zip: sources sit inside one top folder (e.g. VibeCoderAI/). Move them up to proj/.
            if [ ! -f proj/settings.gradle.kts ] && [ ! -f proj/settings.gradle ]; then
              top="$(find proj -maxdepth 2 -name 'settings.gradle*' -printf '%h\n' | head -1)"
              [ -n "$top" ] && [ "$top" != "proj" ] || { echo "No settings.gradle found in zip"; exit 1; }
              mv "$top" proj_root && rm -rf proj && mv proj_root proj
            fi
          else
            # Flat zip: every file sits in one folder and "@@" stands for "/" in its name.
            mkdir flat && unzip -q "$Z" -d flat
            find flat -maxdepth 1 -type f -printf '%f\n' | while IFS= read -r f; do
              t="proj/${f//@@//}"
              mkdir -p "$(dirname "$t")"
              mv "flat/$f" "$t"
            done
          fi
          ls proj
      - name: Fetch llama.cpp (pinned)
        run: git clone --depth 1 --branch b12020 https://github.com/ggml-org/llama.cpp proj/app/src/main/cpp/llama.cpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - run: yes | sdkmanager --licenses > /dev/null || true
      - run: sdkmanager "platforms;android-36" "cmake;3.22.1" || true
      - name: Build WebView shell (embedded into the app)
        run: |
          cd proj
          gradle :webshell:assembleDebug --no-daemon --console=plain
          mkdir -p app/src/main/assets
          cp webshell/build/outputs/apk/debug/*.apk app/src/main/assets/webshell.apk
          ls -la app/src/main/assets
      - run: cd proj && gradle :app:assembleDebug --no-daemon --console=plain
      - name: Show native + template contents
        if: always()
        run: unzip -l proj/app/build/outputs/apk/debug/app-debug.apk | grep -E "libllama-android|webshell" || true
      - name: Collect debug APK
        if: always()
        run: mkdir -p out/debug && cp proj/app/build/outputs/apk/debug/*.apk out/debug/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VibeCoderAI-debug-apk
          path: out/debug/*.apk

      # Unit tests run after the APK is already uploaded, so a failing test never blocks the download.
      - name: Unit tests
        id: unit
        continue-on-error: true
        run: cd proj && gradle :app:testDebugUnitTest --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: steps.unit.outcome == 'failure'
        with:
          name: unit-test-reports
          path: proj/app/build/reports/tests/

      # ---- Release APK: only when KEYSTORE_BASE64, STORE_PASSWORD and KEY_PASSWORD secrets exist ----
      # The keystore must contain the key alias "upload" (see signingConfigs in app/build.gradle.kts).
      - name: Build signed release APK
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/my-upload-key.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/my-upload-key.jks"
          cd proj
          gradle :app:assembleRelease --no-daemon --console=plain
          mkdir -p ../out/release && cp app/build/outputs/apk/release/*.apk ../out/release/
          rm -f "$RUNNER_TEMP/my-upload-key.jks"
      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING == 'true'
        with:
          name: VibeCoderAI-release-apk
          path: out/release/*.apk

      # ---- Optional GPU (Vulkan) variant: never breaks the main build ----
      - name: Vulkan + SPIRV headers (not shipped in the NDK)
        id: vkheaders
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers "$RUNNER_TEMP/Vulkan-Headers"
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers "$RUNNER_TEMP/SPIRV-Headers"
          cmake -S "$RUNNER_TEMP/SPIRV-Headers" -B "$RUNNER_TEMP/spirv-build" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/spirv-install" -DSPIRV_HEADERS_ENABLE_TESTS=OFF -DSPIRV_HEADERS_ENABLE_INSTALL=ON
          cmake --install "$RUNNER_TEMP/spirv-build"
      - name: Build Vulkan (GPU) debug variant
        id: vulkan
        if: steps.vkheaders.outcome == 'success'
        continue-on-error: true
        run: |
          cd proj
          gradle :app:assembleDebug -PvibeVulkan=true \
            -PvibeVulkanHeaders="$RUNNER_TEMP/Vulkan-Headers" \
            -PvibeSpirvHeadersDir="$RUNNER_TEMP/spirv-install/share/cmake/SPIRV-Headers" \
            --no-daemon --console=plain
          mkdir -p ../out/vulkan
          for f in app/build/outputs/apk/debug/*.apk; do cp "$f" "../out/vulkan/$(basename "${f%.apk}")-vulkan.apk"; done
      - uses: actions/upload-artifact@v4
        if: steps.vulkan.outcome == 'success'
        continue-on-error: true
        with:
          name: VibeCoderAI-vulkan-debug-apk
          path: out/vulkan/*.apk
